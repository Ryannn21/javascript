<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste</title>
</head>
<body>
    <h1>Sistema de Verificação de Nacionalidade</h1>
    Verificar Nacinalidade: <input type="string" name="txtnac" id="txtnac">
    <input type="button" value="Verificar" onclick="conferir()">
    <div id="res"></div>

    <script>
        function conferir() {
            var txtnac = window.document.querySelector('input#txtnac')
            var res = window.document.querySelector('div#res')
            var nac = String(txtnac.value).toLocaleUpperCase()
            res.innerHTML = `Sua Nacionalidade é <strong>${nac}! </strong>`

            if (nac == 'Brasil') {
                res.innerHTML += `Você e <strong>Brasileiro!</strong>`
            } else 
            res.innerHTML += `Você <strong>não é Brasileiro</strong>`
        }
    </script>
</body>
</html>
